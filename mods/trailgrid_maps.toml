id = "trailgrid_maps"
kind = "native-mod"
name = "Kadir's Map"
summary = "Explore with a configurable minimap, a persistent world map, waypoint groups, and entity radar."
description = """
Explore with a minimap and a world map that remembers visited terrain. Find waypoints by name, organize them into groups, and jump to their map locations from the waypoint list.

- **M** opens the world map, **N** opens the waypoint list, **K** adds a waypoint, and **Y** opens map settings.
- Filter waypoints by dimension, share waypoint links, and enable automatic death waypoints. Import tools read supported map, settings, and waypoint formats from existing Xaero data.
- On servers, the map can select a different terrain cache and waypoint list when the server reports a distinct world. Choose or bind a map manually in **M → Server worlds**.
- English is the default. The interface also follows supported game languages.
- Requires Minecraft Java Edition 26.3 and the matching Horizon Nightly. Use 0.1.7 for November 21 (`8f83e5c`) or 0.1.0 for November 20 (`0a875da`).

Based on [Minimap, Worldmap and waypoints reworked](https://github.com/Gurov08ruS/Minimap-Worldmap-and-waypoints-reworked) by daniliammo and Gurov08ruS.
"""
authors = ["Kadir (maintainer)"]
owners = ["groznen95"]
owner_ids = [273570573]
source = "https://github.com/groznen95/trailgrid"
license = "GPL-3.0-only"
icon = "icons/trailgrid_maps.png"
screenshots = [
  "screenshots/trailgrid_maps/settings.png",
  "screenshots/trailgrid_maps/waypoints.png",
]
categories = ["utility", "adventure"]
tags = ["map", "minimap", "navigation", "waypoints"]

